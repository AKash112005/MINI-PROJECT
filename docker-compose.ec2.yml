services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_TARGETS_FILE: /etc/prometheus-targets/targets.json
    expose:
      - "5000"
    volumes:
      - ./prometheus-targets:/etc/prometheus-targets
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    expose:
      - "9090"
    volumes:
      - ./docker/prometheus-ec2.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-targets:/etc/prometheus-targets:ro
      - prometheus-data:/prometheus

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in the root .env file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  prometheus-data:
  caddy-data:
  caddy-config:
