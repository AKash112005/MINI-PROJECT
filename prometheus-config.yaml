apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:

      - job_name: "prometheus"
        static_configs:
          - targets:
              - "localhost:9090"


      - job_name: "ubuntu-node-exporter"
        static_configs:
          - targets:
              - "13.234.30.85:9100"
            labels:
              server: "AWS Ubuntu Production"


      - job_name: "cloudwatchx-dynamic"
        file_sd_configs:
          - files:
              - "/etc/prometheus-targets/targets.json"
            refresh_interval: 10s